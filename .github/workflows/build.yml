name: Build

# Follows the JDK's stable line (openjdk/jdk27u): every day, and when the recipe changes, if its latest GA and this recipe
# have no release yet, builds the iOS and Android runtimes from it with openjdk-mobile.patch and inprocess.patch and
# publishes them, in the same run, as jdk-mobile-<version>b<build>.<revision> (see README.md)
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ga:
        description: GA tag of the line to build (default its latest, e.g. jdk-27-ga)
        required: false
      force:
        description: Build even if this GA and recipe have a release
        type: boolean
        default: false
  push:
    branches: [mobile-runtime]
    paths: [build.sh, openjdk-mobile.patch, inprocess.patch, jvm_launcher.c, smoke/**, .github/workflows/build.yml]

permissions:
  contents: write

env:
  # The stable line the patch is ported to
  JDK_LINE: '27'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.version.outputs.repo }}
      commit: ${{ steps.version.outputs.commit }}
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
      key: ${{ steps.version.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GA: ${{ inputs.ga }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          repo=https://github.com/openjdk/jdk${JDK_LINE}u.git
          tags=$(git ls-remote --tags "$repo" "jdk-$JDK_LINE*")
          # The line's latest GA (jdk-27-ga, jdk-27.0.1-ga...), its commit and the JDK build it is (jdk-27+35)
          ga=${GA:-$(echo "$tags" | awk '{print $2}' | sed -n 's|^refs/tags/\(jdk-.*-ga\)^{}$|\1|p' | sort -V | tail -1)}
          commit=$(echo "$tags" | awk -v ref="refs/tags/$ga^{}" '$2 == ref {print $1}')
          [ -n "$commit" ] || { echo "No GA tag $ga in $repo" >&2; exit 1; }
          jdkTag=$(echo "$tags" | awk -v c="$commit" '$1 == c {print $2}' | sed -n 's|^refs/tags/\(jdk-[0-9.]*+[0-9]*\)^{}$|\1|p' | head -1)
          version=${ga#jdk-}; version=${version%-ga}
          jdkBuild=${jdkTag##*+}

          # A release per GA and recipe (the patch, the script, the launcher)
          recipe=$(git rev-parse HEAD:openjdk-mobile.patch HEAD:inprocess.patch HEAD:build.sh HEAD:jvm_launcher.c | git hash-object --stdin | cut -c1-12)
          key="$ga ($commit), recipe $recipe"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | [.tag_name, .body] | @tsv')
          if [ "$FORCE" != "true" ] && echo "$releases" | grep -qF "$key"; then
            echo "Already released: $key"
            exit 0
          fi
          prefix="jdk-mobile-${version}b$jdkBuild."
          revision=$(echo "$releases" | cut -f1 | sed -n "s/^$(echo "$prefix" | sed 's/[.+]/\\&/g')\([0-9]*\)$/\1/p" | sort -n | tail -1)
          build="$jdkBuild.$(( ${revision:-0} + 1 ))"
          {
            echo "repo=$repo"
            echo "commit=$commit"
            echo "tag=jdk-mobile-${version}b$build"
            echo "suffix=$version|$build"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"
          echo "Next: jdk-mobile-${version}b$build ($jdkTag, $key)"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        # The script's target, the asset's (platform and architecture, as the JBR names them) and the host: iOS needs
        # Xcode, Android builds on Linux (the NDK's own host, and the smoke test's)
        include:
          - { target: ios-simulator, asset: ios-simulator-aarch64, os: macos-15 }
          - { target: ios-device, asset: ios-device-aarch64, os: macos-15 }
          - { target: android-aarch64, asset: android-aarch64, os: ubuntu-latest }
          - { target: android-x64, asset: android-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe
      - name: OpenJDK
        run: |
          git init -q jdk
          git -C jdk fetch -q --depth 1 ${{ needs.version.outputs.repo }} ${{ needs.version.outputs.commit }}
          git -C jdk checkout -q FETCH_HEAD
      # The boot JDK: the line's own release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LINE }}
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq autoconf clang libfontconfig1-dev
      - name: Android NDK
        if: startsWith(matrix.target, 'android')
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build
        env:
          SUFFIX: ${{ needs.version.outputs.suffix }}
        run: |
          # jdk-mobile-<version>-<platform>-<arch>-b<build>, as the JBR names its archives
          asset="jdk-mobile-${SUFFIX%%|*}-${{ matrix.asset }}-b${SUFFIX##*|}"
          BOOT_JDK="$JAVA_HOME" recipe/build.sh ${{ matrix.target }} jdk dist "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          retention-days: 7

  # The x86_64 Android runtime on an emulator (GitHub's Linux runners have KVM; none runs an arm64 one): its launcher
  # runs a program that exercises the JIT, threads, time zones and files
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe
      - uses: actions/download-artifact@v4
        with:
          name: android-x64
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_LINE }}
      - name: Runtime and program
        run: |
          mkdir -p runtime smoke
          tar -xzf dist/*.tar.gz -C runtime
          javac --release 21 -d smoke recipe/smoke/Smoke.java
          (cd smoke && jar --create --file ../smoke.jar *.class)
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb push runtime/jniLibs/x86_64/libjvmlauncher.so /data/local/tmp/libjvmlauncher.so
            adb push runtime/lib /data/local/tmp/jdk
            adb push smoke.jar /data/local/tmp/smoke.jar
            adb shell mkdir -p /data/local/tmp/smoke-tmp
            adb shell chmod 755 /data/local/tmp/libjvmlauncher.so
            adb shell /data/local/tmp/libjvmlauncher.so /data/local/tmp/jdk /data/local/tmp/smoke.jar Smoke -Djava.io.tmpdir=/data/local/tmp/smoke-tmp -XX:AltTempDir=/data/local/tmp/smoke-tmp | tee smoke.out
            grep -q "smoke ok" smoke.out

  release:
    needs: [version, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          KEY: ${{ needs.version.outputs.key }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "OpenJDK $JDK_LINE with openjdk/mobile's port, for iOS (Zero) and Android (server VM): $KEY."
